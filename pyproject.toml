[project]
name = "legal-saathi"
version = "0.1.0"
description = "Plain-language help with tenant deposit and consumer refund problems in India."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "openai>=1.40",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "jsonschema>=4.22",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
